version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cantiere-track-db
    environment:
      POSTGRES_DB: cantieretrack
      POSTGRES_USER: cantieretrack
      POSTGRES_PASSWORD: cantieretrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantieretrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cantiere-track-backend
    environment:
      DATABASE_URL: postgresql://cantieretrack:cantieretrack@db:5432/cantieretrack
      SECRET_KEY: your-secret-key-change-in-production-min-32-chars-long
      DEBUG: "True"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head || echo 'Migration failed or no migrations to run' &&
        echo 'Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cantiere-track-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
